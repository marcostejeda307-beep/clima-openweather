<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Weather App</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="container text-center">
        <h1 class="mb-4 text-neon">CLIMA NEÓN</h1>
        
        <div class="search-box mx-auto mb-5">
            <div class="input-group">
                <input type="text" id="cityInput" class="form-control bg-black text-white border-neon" placeholder="Escribe una ciudad..." aria-label="Buscar ciudad">
                <button class="btn btn-neon" type="button" id="searchBtn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <div id="weatherContainer" class="row justify-content-center">
            <!-- Las tarjetas aparecerán aquí -->
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
